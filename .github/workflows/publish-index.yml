name: Publish index.html from release asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v1.0.0 --pattern 'mis-trabajos.html' --dir /tmp/asset --clobber
      - name: Place as index.html and commit
        run: |
          cp /tmp/asset/mis-trabajos.html index.html
          git config user.name "gallardospainting"
          git config user.email "gallardogeneralpaint@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add index.html from release asset v1.0.0"
          git push




















