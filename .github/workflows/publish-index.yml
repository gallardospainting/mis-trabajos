name: Publish lightweight site from release asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v1.1.0 --pattern 'mis-trabajos-light-v2.zip' --dir /tmp/asset --clobber
      - name: Extract site and commit
        run: |
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -o /tmp/asset/mis-trabajos-light-v2.zip -d /tmp/site
          cp /tmp/site/mis-trabajos-light/index.html index.html
          rm -rf assets
          cp -r /tmp/site/mis-trabajos-light/assets assets
          git config user.name "gallardospainting"
          git config user.email "gallardogeneralpaint@gmail.com"
          git add index.html assets
          git diff --cached --quiet || git commit -m "Publish lightweight site from release asset v1.1.0"
          git push
